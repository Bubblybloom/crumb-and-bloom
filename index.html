<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Pacifico&display=swap" rel="stylesheet">
    <title>Crumb & Bloom</title>
</head>
<body>
    <header>
        <h3 class="logo">Crumb & Bloom</h3>
        <ul class="header-links">
            <li><a href="https://github.com/Bubblybloom">Home</a></li>
            <li><a href="https://github.com/Bubblybloom">Our Bakes</a></li>
            <li><a href="https://github.com/Bubblybloom">About Us</a></li>
            <li><a href="https://github.com/Bubblybloom">Visit</a></li>
            <li><a href="https://github.com/Bubblybloom">Contact</a></li>
        </ul>
    </header>
    <main>
        <section class="hero">
            <div class="hero-content">
                <h1 class="main-font">Baked to make you happy</h1>
                <p class="secondary-font">Small-batch cakes, pastries and ridiculously good things,
                    made fresh every morning.</p>
            </div>
            <div class="hero-buttons">
                <button class="dark-button">See the bakes</button>
                <button class="light-button">Visit us</button>
            </div>
            <img src="images/hero-image.png" alt="Cake, muffins, and pastries on a marble table, with morning light streaming in from the side." width="1959" height="803">
        </section>
        <section class="categories-container">
            <h2 class="categories-title">FRESH FROM THE OVEN</h2>
            <div class="categories-cards">
                <figure>
                    <img src="images/icon-cakes.PNG" alt="Drawing of a cake on a pink base" width="100" height="100">
                    <figcaption>
                        <h3 class="fantasy-font">Cakes</h3>
                        <p class="secondary-font">Layered, frosted and always worth celebrating.</p>
                    </figcaption>
                </figure>
                <figure>
                    <img src="images/icon-pastries.PNG" alt="Drawing of some pastries on a pink background." width="100" height="100">
                    <figcaption>
                        <h3 class="fantasy-font">Pastries</h3>
                        <p class="secondary-font">Buttery, flaky, filled and baked every morning.</p>
                    </figcaption>
                </figure>
                <figure>
                    <img src="images/icon-cookies.PNG" alt="Drawing of some cookies on a pink background." width="100" height="100">
                    <figcaption>
                        <h3 class="fantasy-font">Cookies</h3>
                        <p class="secondary-font">Crisp edges, gooey middles. You know the deal.</p>
                    </figcaption>
                </figure>
                <figure>
                    <img src="images/icon-seasonal.PNG" alt="Drawing of autumn cake on a pink background." width="100" height="100">
                    <figcaption>
                        <h3 class="fantasy-font">Seasonal</h3>
                        <p class="secondary-font">Limited bakes inspired by whatever we're craving right now.</p>
                    </figcaption>
                </figure>

            </div>
        </section>
    </main>
    <footer>

    </footer>
    
</body>
</html>
